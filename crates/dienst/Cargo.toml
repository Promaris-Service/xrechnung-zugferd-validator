[package]
name = "erechnung-validator-dienst"
description = "HTTP-Dienst: prueft E-Rechnungen je Upload in einer frischen, rechtlosen WASI-Component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "erechnung-validator-dienst"
path = "src/main.rs"

[dependencies]
wasmtime = "49"
wasmtime-wasi = "49"
anyhow = "1"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
