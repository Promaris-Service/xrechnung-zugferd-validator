[package]
name = "erechnung-validator"
description = "WASI component and pure-Rust library for EN 16931 e-invoice validation (XRechnung, ZUGFeRD, Factur-X): executes the original KoSIT and Mustang artifacts, byte-identical, without a JVM"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["wasi", "xrechnung", "zugferd", "kosit", "mustang"]
categories = ["finance", "parser-implementations", "wasm"]

[dependencies]
oxixml-xslt.workspace = true
oxixml-schema.workspace = true
oxixml-infoset.workspace = true
oxixml-schematron.workspace = true
roxmltree.workspace = true
# PDF-Container lesen (ZUGFeRD/Factur-X): eingebettetes Rechnungs-XML entpacken.
# Schlank gehalten (keine Default-Features: ohne rayon/jiff/time/chrono) -> wasm-tauglich.
lopdf = { version = "0.44", default-features = false }
serde.workspace = true
serde_json.workspace = true
