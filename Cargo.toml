[workspace]
resolver = "2"
members = ["crates/core", "crates/component", "crates/cli", "crates/dienst"]
exclude = ["examples/host-wasmtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Promaris-Service/xrechnung-zugferd-validator"
homepage = "https://promaris.nrw"
rust-version = "1.90"

[workspace.dependencies]
oxixml-xslt = "0.1.2"
oxixml-schema = "0.1.2"
oxixml-infoset = "0.1.2"
oxixml-schematron = "0.1.2"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Maximale Performance: fat LTO, ein Codegen-Unit, volle Optimierung.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
